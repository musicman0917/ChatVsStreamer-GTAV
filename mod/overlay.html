<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chat vs Streamer</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: rgba(15, 10, 24, 0.84);
    --edge: rgba(255, 255, 255, 0.12);
    --pink: #ff3d8b;
    --cyan: #26e0d4;
    --amber: #ffb627;
    --text: #f6f1ff;
    --muted: #a99fc0;
    --sabotage: #ff3d57;
    --blessing: #3ddc97;
    --event: #7f8cff;
  }
  html, body { margin: 0; background: transparent; color: var(--text); font: 600 15px/1.35 Inter, "Segoe UI", sans-serif; overflow: hidden; }

  #panel { position: absolute; top: 16px; left: 16px; width: 300px; background: var(--bg); border: 1px solid var(--edge); border-top: 3px solid var(--pink); border-radius: 6px; padding: 12px 14px; }
  h1 { font: 700 23px Oswald, "Arial Narrow", sans-serif; letter-spacing: .5px; margin: 0; text-transform: uppercase; }
  h1 span { color: var(--pink); }
  h2 { font: 500 13px Oswald, "Arial Narrow", sans-serif; color: var(--cyan); margin: 12px 0 4px; text-transform: uppercase; letter-spacing: 1px; display: flex; justify-content: space-between; }
  h2 small { color: var(--muted); font: inherit; text-transform: none; letter-spacing: 0; }
  .status { font-size: 11px; color: var(--muted); }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin: 0 3px 0 6px; background: #555; }
  .dot:first-of-type { margin-left: 0; }
  .dot.on { background: var(--blessing); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; padding: 1px 0; }
  li .price { color: var(--amber); font-variant-numeric: tabular-nums; }
  #shop { min-height: 290px; transition: opacity .25s; }
  #shop.fade { opacity: 0; }
  .tier-Blessing li span:first-child { color: #8cf0c2; }
  .tier-Devastating li span:first-child { color: #ff9aa8; }

  #active { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
  .active { width: 150px; background: var(--bg); border: 1px solid var(--edge); border-radius: 5px; padding: 6px 9px 7px; font-size: 12px; text-align: center; }
  .bar { height: 3px; background: rgba(255,255,255,.14); border-radius: 2px; margin-top: 5px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--cyan); transition: width .9s linear; }

  #toasts { position: absolute; right: 16px; bottom: 16px; width: 400px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  .toast { background: var(--bg); border-left: 4px solid var(--event); border-radius: 4px; padding: 10px 14px; width: 100%; box-sizing: border-box; animation: in .35s ease-out, out .5s ease-in 6.5s forwards; }
  .toast.sabotage { border-color: var(--sabotage); }
  .toast.blessing { border-color: var(--blessing); }
  .toast .who { font: 700 17px Oswald, "Arial Narrow", sans-serif; color: var(--amber); letter-spacing: .3px; }
  @keyframes in { from { transform: translateX(40px); opacity: 0; } }
  @keyframes out { to { transform: translateX(40px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .toast { animation: none; } #shop { transition: none; } .bar i { transition: none; } }
</style>
</head>
<body>
<div id="panel">
  <h1>Chat <span>vs</span> Streamer</h1>
  <div class="status"><span id="g" class="dot"></span>game<span id="t" class="dot"></span>twitch <span id="q"></span></div>
  <h2><span id="tier">Shop</span><small>!buy &lt;name&gt;</small></h2>
  <ul id="shop"></ul>
  <h2>Top chaos</h2>
  <ul id="top"></ul>
</div>
<div id="active"></div>
<div id="toasts"></div>
<script>
  const el = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const TIERS = ["Nuisance", "Disruptive", "Painful", "Devastating", "Blessing"];

  let shop = [];
  let tierIndex = 0;

  function drawShop() {
    const tier = TIERS[tierIndex];
    el("tier").textContent = tier;
    el("shop").className = `tier-${tier}`;
    el("shop").innerHTML = shop.filter(e => e.tier === tier).map(e =>
      `<li><span>${esc(e.id)}</span><span class="price">${e.price}</span></li>`).join("");
  }

  // More than 50 effects won't fit on screen at once, so the shop pages through tiers.
  function nextTier() {
    el("shop").classList.add("fade");
    setTimeout(() => {
      tierIndex = (tierIndex + 1) % TIERS.length;
      drawShop();
    }, 260);
  }

  function drawActive(active) {
    el("active").innerHTML = active.map(a => {
      const pct = a.duration > 0 ? Math.max(0, Math.min(100, a.remaining / a.duration * 100)) : 0;
      return `<div class="active">${esc(a.name)}<div class="bar"><i style="width:${pct}%"></i></div></div>`;
    }).join("");
  }

  async function refresh() {
    try {
      const s = await (await fetch("/state")).json();
      el("g").classList.toggle("on", s.ready);
      el("t").classList.toggle("on", s.twitch);
      el("q").textContent = !s.enabled ? "· paused" : s.queued ? `· ${s.queued} queued` : "";
      if (JSON.stringify(shop) !== JSON.stringify(s.shop)) { shop = s.shop; drawShop(); }
      el("top").innerHTML = s.leaderboard.map(v =>
        `<li><span>${esc(v.name)}</span><span class="price">${v.points}</span></li>`).join("");
      drawActive(s.active);
    } catch { /* the game isn't running yet */ }
  }

  function toast(ev) {
    const verb = { sabotage: "sabotaged the streamer with", blessing: "blessed the streamer with" }[ev.type] || "";
    const div = document.createElement("div");
    div.className = `toast ${ev.type}`;
    div.innerHTML = `<span class="who">${esc(ev.viewer)}</span> ${verb} ${esc(ev.text)}`;
    el("toasts").appendChild(div);
    setTimeout(() => div.remove(), 7200);
  }

  const TOAST_TYPES = new Set(["sabotage", "blessing", "sub", "bits", "raid", "points", "status"]);

  function connect() {
    const es = new EventSource("/events");
    es.onmessage = m => {
      const ev = JSON.parse(m.data);
      if (TOAST_TYPES.has(ev.type)) { toast(ev); refresh(); }
    };
    es.onerror = () => { es.close(); setTimeout(connect, 3000); };
  }

  refresh();
  setInterval(refresh, 1000);
  setInterval(nextTier, 9000);
  connect();
</script>
</body>
</html>
