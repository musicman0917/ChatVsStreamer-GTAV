<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Chaos Mod Overlay</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="root">
    <header class="brand">
      <span class="brand-vine">VINEWOOD</span>
      <span class="brand-chaos">CHAOS MODE</span>
    </header>

    <section id="catalog" class="panel catalog"></section>

    <section id="leaderboard" class="panel leaderboard">
      <h2>Top Chaos Agents</h2>
      <ol id="leaderboard-list"></ol>
    </section>

    <section id="chat" class="panel chat">
      <div id="chat-list"></div>
    </section>

    <div id="alerts"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
